<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wallboard · PPD Antiokhia</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
/* Layar monitor panitia untuk TV 16:9. Ukuran mengikuti lebar layar supaya terbaca dari jauh. */
:root{
  --bg:#0E0D0C; --panel:#191715; --panel2:#221F1C; --line:#2E2A26; --ink:#F7F3EE; --muted:#A39A8E; --dim:#6F675D;
  --orange:#FF8A3D; --green:#58C98A;
  --num:"Big Shoulders Display", "Arial Narrow", sans-serif; --body:"Instrument Sans", system-ui, sans-serif;
  --g:clamp(10px,1.1vw,22px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{overflow:hidden}
[hidden]{display:none!important}
.wb{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--g);padding:var(--g) calc(var(--g)*1.3)}
h2{font:800 clamp(16px,1.5vw,32px)/1 var(--num);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:1vw}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.4vw;padding:1.2vw 1.5vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* header */
.top{display:flex;align-items:center;gap:1.2vw}
.top img{width:3.2vw;min-width:34px;height:auto;border-radius:50%}
.top h1{font:900 clamp(20px,2.3vw,48px)/1 var(--num);text-transform:uppercase}
.top .sub{color:var(--muted);font-size:clamp(11px,.95vw,19px);font-weight:600;margin-top:.25vw}
.top .right{margin-left:auto;display:flex;align-items:center;gap:1.4vw;text-align:right}
.clock b{display:block;font:800 clamp(20px,2.4vw,50px)/1 var(--num);font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:clamp(10px,.8vw,16px);font-weight:600}
.fs{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:.5vw .9vw;font:600 clamp(10px,.8vw,15px) var(--body);cursor:pointer}

/* angka utama */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:1.4vw;padding:1.2vw 1.6vw}
.kpi .lbl{font-weight:700;color:var(--muted);font-size:clamp(12px,1.1vw,23px)}
.kpi .val{font:900 clamp(48px,7vw,146px)/1 var(--num);font-variant-numeric:tabular-nums;margin-top:.3vw}
.kpi:first-child .val{color:var(--orange)}
.bump{animation:bump 1.2s ease}
@keyframes bump{20%{transform:scale(1.05)}}

/* tengah */
.mid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--g);min-height:0}
.rank{list-style:none;padding:0;display:grid;gap:.8vw;flex:1;align-content:start;min-height:0;overflow:hidden}
.rank li{display:grid;grid-template-columns:2.6vw minmax(0,1fr) auto;gap:.3vw 1vw;align-items:center}
.rank .no{grid-row:span 2;font:900 clamp(18px,1.9vw,40px)/1 var(--num);color:var(--dim);text-align:center}
.rank li:first-child .no{color:var(--orange)}
.rank .nm{font-weight:700;font-size:clamp(13px,1.25vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .n{font:800 clamp(16px,1.7vw,36px)/1 var(--num);text-align:right;font-variant-numeric:tabular-nums}
.rank .bar{grid-column:2/4;height:.55vw;min-height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#B85A1E,var(--orange));transition:width 1s ease}

/* acara berlangsung */
.now{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.8vw;min-height:0}
.now .tag{align-self:flex-start;display:inline-flex;align-items:center;gap:.5vw;padding:.3vw .9vw;border-radius:99px;font:700 clamp(11px,.9vw,18px) var(--body);background:rgba(88,201,138,.14);color:var(--green)}
.now .tag i{width:.6vw;height:.6vw;min-width:8px;min-height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.now .tag.wait{background:var(--panel2);color:var(--muted)}.now .tag.wait i{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,201,138,.6)}70%{box-shadow:0 0 0 .8vw rgba(88,201,138,0)}100%{box-shadow:0 0 0 0 rgba(88,201,138,0)}}
.now .title{font:900 clamp(30px,3.8vw,80px)/1 var(--num);text-transform:uppercase}
.now .meta{color:var(--muted);font-weight:600;font-size:clamp(12px,1.15vw,24px)}
.now .present{display:flex;align-items:baseline;gap:.8vw;margin-top:.4vw}
.now .present b{font:900 clamp(36px,4.6vw,96px)/1 var(--num);color:var(--orange);font-variant-numeric:tabular-nums}
.now .present span{color:var(--muted);font-weight:600;font-size:clamp(12px,1.15vw,24px)}
.now .next{margin-top:auto;padding-top:.9vw;border-top:1px solid var(--line);color:var(--muted);font-weight:600;font-size:clamp(11px,1vw,21px)}
.now .next b{color:var(--ink)}

/* pendaftaran terbaru */
.recent{padding-bottom:1vw}
.feed{list-style:none;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.8vw;overflow:hidden}
.feed li{padding:.8vw 1vw;border-radius:.9vw;background:var(--panel2);border:1px solid transparent;min-width:0}
.feed li.new{border-color:var(--orange);animation:flash 2.4s ease}
@keyframes flash{0%,30%{background:rgba(255,138,61,.28)}}
.feed .c{display:block;font-weight:700;font-size:clamp(12px,1.05vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .m{display:block;color:var(--muted);font-size:clamp(10px,.85vw,17px);font-weight:600;margin-top:.2vw}
.empty{color:var(--dim);font-size:clamp(12px,1vw,20px)}
.offline{position:fixed;right:calc(var(--g)*1.3);bottom:.4vw;color:#F2C14E;font-size:clamp(10px,.75vw,15px);font-weight:600}
.cursorless{cursor:none}
</style>
</head>
<body>
<div class="wb">
  <header class="top">
    <img src="/assets/logo.png" alt="">
    <div><h1 id="evName">PPD Antiokhia</h1><div class="sub" id="evSub"></div></div>
    <div class="right">
      <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
      <button class="fs" id="fsBtn" type="button">Layar penuh</button>
    </div>
  </header>

  <section class="kpis">
    <div class="kpi"><div class="lbl">Peserta</div><div class="val" id="kPeserta">0</div></div>
    <div class="kpi"><div class="lbl">Gereja</div><div class="val" id="kGereja">0</div></div>
    <div class="kpi"><div class="lbl">Pengunjung website</div><div class="val" id="kVisit">0</div></div>
  </section>

  <section class="mid">
    <div class="card"><h2>Peserta terbanyak</h2><ol class="rank" id="rank"></ol></div>
    <div class="card"><h2>Acara berlangsung</h2><div class="now" id="now"></div></div>
  </section>

  <section class="card recent"><h2>Pendaftaran terbaru</h2><ul class="feed" id="feed"></ul></section>
</div>
<div class="offline" id="offline" hidden>Offline · menampilkan data terakhir</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString("id-ID");
  const pad = (n) => String(n).padStart(2, "0");
  const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"], BLN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const wib = (t) => new Date(t + 7 * 36e5); // selalu tampil dalam WIB
  const hm = (iso) => { const d = wib(new Date(iso).getTime()); return `${pad(d.getUTCHours())}.${pad(d.getUTCMinutes())}`; };
  const tgl = (iso) => { const d = wib(new Date(iso).getTime()); return `${d.getUTCDate()} ${BLN[d.getUTCMonth()]}`; };
  let D = null, lastIds = null, prev = {};

  function tick() {
    const n = wib(Date.now());
    $("#clock").textContent = `${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}`;
    $("#date").textContent = `${HARI[n.getUTCDay()]}, ${n.getUTCDate()} ${BLN[n.getUTCMonth()]} ${n.getUTCFullYear()}`;
  }
  setInterval(tick, 1000); tick();

  function setNum(el, v) {
    const from = prev[el.id] ?? v; prev[el.id] = v;
    if (from === v) { el.textContent = fmt(v); return; }
    if (from < v) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(from + (v - from) * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const ago = (iso) => {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "Baru saja"; if (s < 3600) return Math.floor(s / 60) + " menit lalu"; if (s < 86400) return Math.floor(s / 3600) + " jam lalu";
    return Math.floor(s / 86400) < 7 ? Math.floor(s / 86400) + " hari lalu" : tgl(iso);
  };

  // ---------- acara berlangsung (mengikuti jadwal sesi) ----------
  function renderNow() {
    if (!D) return;
    const t = Date.now(), list = D.sessions;
    const cur = list.find((s) => new Date(s.start).getTime() <= t && t < new Date(s.end).getTime());
    const next = list.find((s) => new Date(s.start).getTime() > t);
    const when = (s) => `Hari ${s.day} · ${hm(s.start)}–${hm(s.end)}${s.location ? " · " + esc(s.location) : ""}`;
    const nextLine = next ? `<div class="next">Berikutnya: <b>${esc(next.title)}</b> · ${new Date(next.start).toDateString() === new Date(t).toDateString() ? hm(next.start) : tgl(next.start) + ", " + hm(next.start)}</div>` : "";
    let html;
    if (cur) {
      html = `<span class="tag"><i></i>Sedang berlangsung</span>
        <div class="title">${esc(cur.title)}</div>
        <div class="meta">${when(cur)}${cur.speaker ? "<br>" + esc(cur.speaker) : ""}</div>
        <div class="present"><b>${fmt(cur.present)}</b><span>hadir</span></div>${nextLine}`;
    } else if (!list.length) {
      html = `<span class="tag wait"><i></i>Belum ada jadwal</span><div class="meta">Tambahkan sesi di menu Jadwal &amp; kehadiran.</div>`;
    } else if (next) {
      const first = next === list[0];
      html = `<span class="tag wait"><i></i>${first ? "Belum dimulai" : "Jeda"}</span>
        <div class="title">${esc(next.title)}</div>
        <div class="meta">Mulai ${tgl(next.start)}, ${hm(next.start)}${next.location ? " · " + esc(next.location) : ""}</div>`;
    } else {
      html = `<span class="tag wait"><i></i>Selesai</span><div class="title">Semua acara selesai</div><div class="meta">Terima kasih!</div>`;
    }
    if ($("#now").innerHTML !== html) $("#now").innerHTML = html;
  }
  setInterval(renderNow, 15000);

  // ---------- data ----------
  async function load() {
    try {
      const r = await fetch("/api/admin/wallboard", { cache: "no-store", credentials: "same-origin" });
      if (r.status === 401 || r.status === 403) { location.replace("/admin/login.html?next=" + encodeURIComponent("/admin/wallboard.html")); return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      D = await r.json(); render(); $("#offline").hidden = true;
    } catch (_) { $("#offline").hidden = false; }
  }
  function render() {
    $("#evName").textContent = D.event.name || "PPD Antiokhia";
    $("#evSub").textContent = [D.event.dates_label, D.event.location].filter(Boolean).join(" · ");
    setNum($("#kPeserta"), D.participants); setNum($("#kGereja"), D.churches); setNum($("#kVisit"), D.visitors);

    const max = Math.max(1, ...D.top_churches.map((t) => t.n));
    $("#rank").innerHTML = D.top_churches.length ? D.top_churches.map((t, i) => `<li><span class="no">${i + 1}</span><span class="nm">${esc(t.church)}</span>
      <span class="n">${fmt(t.n)}</span><span class="bar"><i style="width:${(t.n / max) * 100}%"></i></span></li>`).join("") : `<li class="empty">Belum ada pendaftaran</li>`;

    $("#feed").innerHTML = D.recent.length ? D.recent.map((r) => `<li${lastIds && !lastIds.includes(r.id) ? ' class="new"' : ""}><span class="c">${esc(r.church)}</span>
      <span class="m">${fmt(r.n)} peserta · <span data-ago="${esc(r.created_at)}">${ago(r.created_at)}</span></span></li>`).join("") : `<li class="empty">Belum ada pendaftaran</li>`;
    lastIds = D.recent.map((r) => r.id);
    renderNow(); fit();
  }
  // Tampilkan hanya yang muat di layar
  function fit() {
    const rank = $("#rank"); [...rank.children].forEach((li) => (li.hidden = false));
    for (let i = rank.children.length - 1; i > 0 && rank.scrollHeight > rank.clientHeight + 1; i--) rank.children[i].hidden = true;
    const feed = $("#feed"), items = [...feed.children]; items.forEach((li) => (li.hidden = false));
    const per = Math.max(2, Math.floor(feed.clientWidth / Math.max(220, innerWidth / 6.5)));
    items.forEach((li, i) => (li.hidden = i >= per));
  }
  window.addEventListener("resize", () => D && fit());
  load(); setInterval(load, 20000);
  setInterval(() => document.querySelectorAll("[data-ago]").forEach((el) => (el.textContent = ago(el.dataset.ago))), 30000);

  // ---------- layar penuh, layar tetap menyala, kursor tersembunyi ----------
  $("#fsBtn").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  document.addEventListener("fullscreenchange", () => { $("#fsBtn").hidden = !!document.fullscreenElement; });
  const keepAwake = async () => { try { if ("wakeLock" in navigator && !document.hidden) await navigator.wakeLock.request("screen"); } catch (_) {} };
  keepAwake(); document.addEventListener("visibilitychange", keepAwake);
  let idle; document.addEventListener("mousemove", () => { document.body.classList.remove("cursorless"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("cursorless"), 3000); });
})();
</script>
</body>
</html>
